name: linux-arm64-example

# Builds the example app for Linux arm64 and uploads the runnable bundle.
# Built inside a Debian bullseye container (glibc 2.31) so the binary runs
# on Raspberry Pi OS from bullseye onward; building on the runner's own
# Ubuntu would require a newer glibc than older Pi images ship.

on:
  workflow_dispatch:
  push:
    branches: [linux-support]

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    container: debian:bullseye
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git curl unzip xz-utils zip clang cmake ninja-build pkg-config libgtk-3-dev
          git config --global --add safe.directory '*'

      # Official Flutter tarballs are x64-only; on arm64 hosts the SDK
      # bootstraps itself from a git checkout.
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Build example (release)
        working-directory: example
        run: |
          flutter --version
          flutter build linux --release

      # Tar before uploading: artifact zips drop the execute bits.
      - name: Pack bundle
        run: tar -C example/build/linux/arm64/release -czf linux-arm64-bundle.tar.gz bundle

      - uses: actions/upload-artifact@v4
        with:
          name: example-linux-arm64
          path: linux-arm64-bundle.tar.gz
