name: flutter_ffi_uvc
description: Control USB(UVC) cameras. Preview, capture, record, adjust settings, and read raw frames, for one camera or several.
version: 1.0.0
repository: https://github.com/cornpip/flutter_ffi_uvc

environment:
  sdk: ^3.8.1
  flutter: '>=3.32.0'

topics:
  - camera
  - usb
  - uvc
  - webcam

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.cornpip.flutter_ffi_uvc
        pluginClass: FlutterFfiUvcPlugin
        ffiPlugin: true
      windows:
        pluginClass: FlutterFfiUvcPluginCApi
      linux:
        pluginClass: FlutterFfiUvcPlugin
