name: flutter_ffi_uvc
description: Plug in a USB (UVC) camera and stream. Texture preview, JPEG capture, MP4 recording, raw frame access, camera controls.
version: 0.12.2-wip
repository: https://github.com/cornpip/flutter_ffi_uvc

environment:
  sdk: ^3.8.1
  flutter: '>=3.32.0'

topics:
  - camera
  - usb
  - uvc
  - webcam
  - libuvc

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.cornpip.flutter_ffi_uvc
        pluginClass: FlutterFfiUvcPlugin
        ffiPlugin: true
      windows:
        pluginClass: FlutterFfiUvcPluginCApi
      linux:
        pluginClass: FlutterFfiUvcPlugin
